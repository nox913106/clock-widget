<!DOCTYPE html>
<!-- 【v2.9】修復 API 連線錯誤，移除不穩定的 worldtimeapi，優化錯誤處理 -->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現在時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 匯入 Roboto Mono (Cyberpunk 風格) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
            opacity: 0;
            transition: opacity .5s ease-in;
            overflow: hidden;
            background-color: #ffffff;
        }

        .dark body {
            background-color: #0f172a; /* dark:bg-slate-900 */
        }

        #main-container {
            box-shadow: 
                0px 10px 30px rgba(0, 0, 0, 0.1),
                inset 0px 1px 1px rgba(255, 255, 255, 0.7);
            border-width: 1px;
            background-color: #ffffff; /* bg-white */
            border-color: #e2e8f0; /* border-slate-200 */
        }

        .dark #main-container {
            box-shadow: 
                0px 10px 30px rgba(0, 0, 0, 0.3),
                inset 0px 1px 1px rgba(255, 255, 255, 0.1),
                inset 0px -1px 0px rgba(255, 255, 255, 0.05);
            background-color: #0f172a; /* dark:bg-slate-900 */
            border-color: #334155; /* dark:border-slate-700 */
        }

        #d, .info-text {
            color: #64748b; /* text-slate-500 */
        }
        .dark #d, .dark .info-text {
            color: #94a3b8; /* dark:text-slate-400 */
        }
        .info-icon {
            color: #64748b; /* text-slate-500 */
        }
        .dark .info-icon {
            color: #94a3b8; /* dark:text-slate-400 */
        }

        .info-card {
            background-color: #f1f5f9; /* bg-slate-100 */
        }
        .dark .info-card {
            background-color: #1e293b; /* dark:bg-slate-800 */
        }
        .info-card:hover {
            background-color: #e2e8f0; /* hover:bg-slate-200 */
        }
        .dark .info-card:hover {
            background-color: #334155; /* dark:hover:bg-slate-700 */
        }

        /**
         * Cyberpunk 時鐘樣式
         */
        #time-container {
            display: flex;
            gap: 0.25rem; /* 4px */
            font-family: 'Roboto Mono', monospace; 
        }
        
        /* 數字和冒號的共用樣式 */
        .time-segment, .time-colon {
            font-size: 2.75rem; /* 44px */
            font-weight: 700;
            line-height: 1.2;
            /* 亮色模式：洋紅色 */
            color: #db2777; /* text-pink-600 */
            transition: color 0.3s, text-shadow 0.3s;
        }

        /* 暗色模式：青色 + 光暈 */
        .dark .time-segment, .dark .time-colon {
            color: #67e8f9; /* text-cyan-300 */
            text-shadow: 
                0 0 5px rgba(103, 232, 249, 0.5),
                0 0 10px rgba(103, 232, 249, 0.4);
        }

        /* 冒號 (閃爍) */
        .time-colon {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: blink 1s step-end infinite;
            transform: translateY(0.05em);
            width: 0.6em;
        }

        @keyframes blink {
            50% {
                .dark & {
                    color: rgba(103, 232, 249, 0.3);
                    text-shadow: 0 0 5px rgba(103, 232, 249, 0.2);
                }
                color: rgba(219, 39, 119, 0.3);
            }
        }

        .time-segment {
            width: 1.6em; 
            text-align: center;
        }

    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2">

    <div id="main-container" class="flex items-center justify-center flex-wrap gap-x-4 gap-y-3 p-4 rounded-2xl transition-transform duration-300 ease-in-out">
        
        <div id="time-container">
            <!-- JS 會動態填入 h, m, s -->
        </div>

        <div id="d" class="text-lg"></div>
        
        <div id="info-cards" class="flex items-center gap-x-2">
            <a id="location-card" href="#" target="_blank" rel="noopener noreferrer" class="info-card flex items-center gap-x-2 px-3 py-1.5 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="info-icon"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="l-text" class="info-text text-sm font-medium">...</span>
            </a>
            <a id="ip-card" href="#" target="_blank" rel="noopener noreferrer" class="info-card flex items-center gap-x-2 px-3 py-1.5 rounded-lg transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="info-icon"><path d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span id="ip-text" class="info-text text-sm font-medium">IP: ...</span>
            </a>
            <button id="theme-toggle" type="button" class="info-card flex items-center justify-center p-2 rounded-lg transition-colors" title="切換主題">
                <svg id="theme-icon-moon" class="info-icon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-icon-sun" class="info-icon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M12 12a4 4 0 110-8 4 4 0 010 8z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        (function(d) {
            let timeOffset = 0;
            const T = { weekdays: ['日', '一', '二', '三', '四', '五', '六'], loading: '正在獲取...', ip: 'IP 位址', unknownLocation: '未知地點', mapTitle: '在 Google Maps 上查看', ipTitle: '查詢 IP 詳細資訊' };
            
            d.getElementById('l-text').innerText = T.loading;

            function initializeTheme() {
                const htmlEl = d.documentElement;
                const toggleBtn = d.getElementById('theme-toggle');
                const sunIcon = d.getElementById('theme-icon-sun');
                const moonIcon = d.getElementById('theme-icon-moon');

                function updateIcons(isDark) {
                    sunIcon.style.display = isDark ? 'block' : 'none';
                    moonIcon.style.display = isDark ? 'none' : 'block';
                }

                function loadTheme() {
                    const savedTheme = localStorage.getItem('theme');
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                        htmlEl.classList.add('dark');
                        updateIcons(true);
                    } else {
                        htmlEl.classList.remove('dark');
                        updateIcons(false);
                    }
                }

                toggleBtn.addEventListener('click', () => {
                    const isDark = htmlEl.classList.toggle('dark');
                    localStorage.setItem('theme', isDark ? 'dark' : 'light'); 
                    updateIcons(isDark);
                });
                
                loadTheme();
            }

            function setResponsiveScale() {
                const container = d.getElementById('main-container');
                const screenWidth = window.screen.width;
                let scaleFactor = 1.0; 
                if (screenWidth >= 7680) scaleFactor = 2.0;
                else if (screenWidth >= 3840) scaleFactor = 1.5;
                else if (screenWidth >= 2560) scaleFactor = 1.25; 
                else if (screenWidth >= 1920) scaleFactor = 1.10; 
                container.style.transform = `scale(${scaleFactor})`;
            }

            window.L = function(json) {
                if (!json) return;
                const locationCard = d.getElementById('location-card');
                const locationTextEl = d.getElementById('l-text');
                const ipCard = d.getElementById('ip-card');
                const ipTextEl = d.getElementById('ip-text');

                const ip = json.ip || '';
                const city = json.city || T.unknownLocation;
                const countryCode = json.country || '';
                
                locationTextEl.innerText = `${city}, ${countryCode}`;
                locationCard.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${city}, ${countryCode}`)}`;
                locationCard.title = T.mapTitle;
                ipTextEl.innerText = `${T.ip}: ${ip}`;
                ipCard.href = `https://ipinfo.io/${ip}`;
                ipCard.title = T.ipTitle;
            };
            const locationScript = d.createElement('script');
            locationScript.src = `https://ipinfo.io?callback=L`;
            d.head.appendChild(locationScript);

            function syncTime(provider) {
                return new Promise((resolve) => {
                    const scriptId = 'time-jsonp-script';
                    const existingScript = d.getElementById(scriptId);
                    if (existingScript) existingScript.remove();
                    
                    const callbackName = 'timeCallback';
                    let apiUrl = '';

                    window[callbackName] = function(data) {
                        try {
                            let serverTime;
                            if (provider === 'worldtimeapi') serverTime = new Date(data.utc_datetime).getTime();
                            else if (provider === 'timeapi') serverTime = new Date(data.currentUtcTime).getTime();
                            if (isNaN(serverTime)) throw new Error('無效的時間格式');
                            timeOffset = serverTime - new Date().getTime();
                            console.log(`時間同步成功 (${provider})`);
                            resolve(true);
                        } catch (e) { 
                            console.warn(`${provider} 資料解析錯誤 (使用本機時間):`, e); 
                            resolve(false); 
                        } 
                        finally { cleanup(); }
                    };
                    
                    // v2.9 修改：移除 worldtimeapi，只保留 timeapi
                    if (provider === 'timeapi') apiUrl = `https://timeapi.io/api/TimeZone/ip?jsonp=${callbackName}`;
                    else return resolve(false);

                    const timer = setTimeout(() => {
                        console.warn(`${provider} 請求超時 (使用本機時間)`);
                        resolve(false);
                        cleanup();
                    }, 5000); // 縮短超時時間為 5秒

                    function cleanup() {
                        clearTimeout(timer);
                        try { delete window[callbackName]; } catch (e) {}
                        const script = d.getElementById(scriptId);
                        if (script) script.remove();
                    }

                    const script = d.createElement('script');
                    script.id = scriptId;
                    script.src = apiUrl;
                    // v2.9 修改：將 console.error 改為 console.warn
                    script.onerror = () => { console.warn(`${provider} 腳本載入失敗 (可能被阻擋或服務離線)，將使用本機時間`); resolve(false); cleanup(); };
                    d.head.appendChild(script);
                });
            }

            function createTimeTile(id) {
                const tile = d.createElement('div');
                tile.className = 'time-segment';
                tile.id = id;
                
                const valueSpan = d.createElement('span');
                valueSpan.className = 'time-segment-value';
                valueSpan.innerText = '00';
                
                tile.appendChild(valueSpan);
                return tile;
            }

            function createTimeColon() {
                const colon = d.createElement('span');
                colon.className = 'time-colon';
                colon.innerText = ':';
                return colon;
            }

            async function initializeTime() {
                // v2.9 修改：只嘗試 timeapi，失敗則靜默降級為本機時間
                let success = await syncTime('timeapi');
                
                if (!success) {
                    console.warn('時間同步失敗或已略過，改用本機系統時間。');
                    timeOffset = 0;
                }

                const timeContainer = d.getElementById('time-container');
                const now = new Date(new Date().getTime() + timeOffset);
                const h = ('0' + now.getHours()).slice(-2);
                const m = ('0' + now.getMinutes()).slice(-2);
                const s = ('0' + now.getSeconds()).slice(-2);

                const hEl = createTimeTile('h');
                hEl.querySelector('.time-segment-value').innerText = h;
                
                const mEl = createTimeTile('m');
                mEl.querySelector('.time-segment-value').innerText = m;
                
                const sEl = createTimeTile('s');
                sEl.querySelector('.time-segment-value').innerText = s;

                timeContainer.appendChild(hEl);
                timeContainer.appendChild(createTimeColon());
                timeContainer.appendChild(mEl);
                timeContainer.appendChild(createTimeColon());
                timeContainer.appendChild(sEl);
                
                const hVal = hEl.querySelector('.time-segment-value');
                const mVal = mEl.querySelector('.time-segment-value');
                const sVal = sEl.querySelector('.time-segment-value');
                
                setInterval(() => {
                    const now = new Date(new Date().getTime() + timeOffset);
                    const hStr = ('0' + now.getHours()).slice(-2);
                    const mStr = ('0' + now.getMinutes()).slice(-2);
                    const sStr = ('0' + now.getSeconds()).slice(-2);
                    
                    const year = now.getFullYear();
                    const month = ('0' + (now.getMonth() + 1)).slice(-2);
                    const day = ('0' + now.getDate()).slice(-2);
                    const weekday = T.weekdays[now.getDay()];

                    if (hVal.innerText !== hStr) hVal.innerText = hStr;
                    if (mVal.innerText !== mStr) mVal.innerText = mStr;
                    if (sVal.innerText !== sStr) sVal.innerText = sStr;

                    d.getElementById('d').innerText = `${year}-${month}-${day} ${weekday}`;
                }, 1000);
            }
            
            initializeTheme();
            initializeTime();
            setResponsiveScale();

            d.body.style.opacity = 1;
        })(document);
    </script>
</body>
</html>
